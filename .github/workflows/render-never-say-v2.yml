name: Render Never Say V2
on:
  push:
    branches:
      - claude/youtube-channel-analysis-lghfsv
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/youtube-channel-analysis-lghfsv
      - name: Run asset & TTS speed probe
        run: |
          python3 classy-academy-test/videos/never-say-v2/fetch_assets_probe.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add classy-academy-test/videos/never-say-v2/render-output/asset_probe.json
          git commit -m "ci: asset probe results [skip ci]" || true
          git push origin claude/youtube-channel-analysis-lghfsv
