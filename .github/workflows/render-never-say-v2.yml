name: Render Never Say V2
on:
  push:
    branches:
      - claude/youtube-channel-analysis-lghfsv
  workflow_dispatch:

concurrency:
  group: render-never-say-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/youtube-channel-analysis-lghfsv

      - name: Query previous workflow runs & commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p classy-academy-test/videos/never-say-v2/render-output
          gh run list --limit 10 --json databaseId,status,conclusion,displayTitle,createdAt > classy-academy-test/videos/never-say-v2/render-output/gh_runs.json || true
          LAST_FAIL=$(gh run list --status failure --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$LAST_FAIL" ] && [ "$LAST_FAIL" != "null" ]; then
            gh run view "$LAST_FAIL" --log-failed | tail -n 120 > classy-academy-test/videos/never-say-v2/render-output/last_fail.log || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add classy-academy-test/videos/never-say-v2/render-output/
          git commit -m "ci(diag): workflow runs status [skip ci]" || true
          git pull --rebase origin claude/youtube-channel-analysis-lghfsv || true
          git push origin claude/youtube-channel-analysis-lghfsv || true

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          pip install -q "kokoro>=0.9.2" soundfile faster-whisper pillow opencv-python-headless numpy scipy
          echo "Dependencies installed at $(date -u)" > classy-academy-test/videos/never-say-v2/render-output/deps.txt
          git add classy-academy-test/videos/never-say-v2/render-output/deps.txt
          git commit -m "ci(status): deps installed [skip ci]" || true
          git pull --rebase origin claude/youtube-channel-analysis-lghfsv || true
          git push origin claude/youtube-channel-analysis-lghfsv || true

      - name: Run full never-say-v2 production pipeline with live status commits
        run: |
          chmod +x classy-academy-test/videos/never-say-v2/render.sh
          cd classy-academy-test/videos/never-say-v2
          ./render.sh 2>&1 | tee render-output/full_pipeline.log || true

      - name: Commit final logs & QA outputs back to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/youtube-channel-analysis-lghfsv || true
          git add classy-academy-test/videos/never-say-v2/render-output/ classy-academy-test/videos/never-say-v2/CREDITS.txt || true
          git commit -m "ci: final pipeline log & QA bundle [skip ci]" || true
          git push origin claude/youtube-channel-analysis-lghfsv || true
