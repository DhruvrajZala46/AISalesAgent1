name: Render Never Say V2
on:
  push:
    branches:
      - claude/youtube-channel-analysis-lghfsv
  workflow_dispatch:

concurrency:
  group: render-never-say-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/youtube-channel-analysis-lghfsv

      - name: Cache raw clips & TTS audio across runs
        uses: actions/cache@v4
        with:
          path: |
            classy-academy-test/videos/never-say-v2/raw
            classy-academy-test/videos/never-say-v2/tts
          key: never-say-v2-assets-${{ hashFiles('classy-academy-test/videos/never-say-v2/ok.txt', 'classy-academy-test/videos/never-say-v2/beats.txt') }}
          restore-keys: |
            never-say-v2-assets-

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          pip install -q "kokoro>=0.9.2" soundfile faster-whisper pillow opencv-python-headless numpy scipy

      - name: Run full never-say-v2 production pipeline with live status commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x classy-academy-test/videos/never-say-v2/render.sh
          cd classy-academy-test/videos/never-say-v2
          ./render.sh 2>&1 | tee /tmp/full_pipeline.log || true
          cp /tmp/full_pipeline.log render-output/full_pipeline.log || true

      - name: Upload Final MP4 & QA Bundle as GitHub Actions Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: never-say-v2-final-video-and-qa
          path: |
            classy-academy-test/videos/never-say-v2/out/never-say-v2.mp4
            classy-academy-test/videos/never-say-v2/render-output/*
            classy-academy-test/videos/never-say-v2/CREDITS.txt
          if-no-files-found: ignore

      - name: Commit final logs & QA outputs back to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add classy-academy-test/videos/never-say-v2/render-output/ classy-academy-test/videos/never-say-v2/CREDITS.txt || true
          git commit -m "ci: final pipeline log & QA bundle [skip ci]" || true
          git pull --rebase -X theirs origin claude/youtube-channel-analysis-lghfsv || true
          git push origin claude/youtube-channel-analysis-lghfsv || true
