<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:LG;src:url(../../assets/fonts/LuckiestGuy.woff2)}@font-face{font-family:ComicNeue;font-weight:700;src:url(../../assets/fonts/comic-neue-latin-700-normal.woff2)}
html,body{margin:0;background:#000;overflow:hidden}svg{display:block}
.cap{font-family:LG,sans-serif;font-size:42px;letter-spacing:1px;paint-order:stroke;stroke:#141414;stroke-width:7px;stroke-linejoin:round;fill:#fff}
.lbl{font-family:Inter,sans-serif;font-weight:900;font-size:22px;letter-spacing:.5px;fill:#111}
.cta{font-family:LG,sans-serif;paint-order:stroke;stroke:#141414;stroke-linejoin:round}
</style></head><body>
<svg id="S" width="720" height="1280" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>
<script src="data.js"></script>
<script>
// =============== helpers ===============
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const eob=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const INK='#2a2322';
const VE='vector-effect="non-scaling-stroke"';
const LN=`stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" ${VE}`;
const LN2=`stroke="${INK}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${VE}`;
const TH=(c)=>`stroke="${c}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none" ${VE}`;
function tr(id,x,y,sx=1,sy=sx,r=0){const e=$(id);if(e)e.setAttribute('transform',`translate(${x},${y}) rotate(${r}) scale(${sx},${sy})`);}
function show(id,v){const e=$(id);if(e)e.setAttribute('opacity',v);}
let DEFS='', UID=0;
// shape with airbrushed inner shading (soft darker edge), like the reference
function shaded(d,fill,shade,w=16,extra=''){const id='c'+(UID++);DEFS+=`<clipPath id="${id}"><path d="${d}"/></clipPath>`;
  return `<path d="${d}" fill="${fill}"/><g clip-path="url(#${id})"><path d="${d}" fill="none" stroke="${shade}" stroke-width="${w}" filter="url(#soft)" opacity=".9"/></g><path d="${d}" fill="none" ${LN} ${extra}/>`;}
// Catmull-Rom smooth path through points
function smooth(pts,closed=false){let s=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;const n=pts.length;
  for(let i=0;i<n-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(n-1,i+2)];
    s+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}
  return s;}
// tapered limb around a centre line (shoulder, elbow, wrist)
function limbD(pts,ws){const L=[],R=[];const n=pts.length;
  for(let i=0;i<n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    const w=ws[i]/2;L.push([pts[i][0]-dy*w,pts[i][1]+dx*w]);R.push([pts[i][0]+dy*w,pts[i][1]-dx*w]);}
  const we=ws[n-1]/2, ws0=ws[0]/2;
  let s=smooth(L);s+=` A${we},${we} 0 0 0 ${R[n-1][0].toFixed(1)},${R[n-1][1].toFixed(1)}`;
  const r=smooth(R.slice().reverse());s+=' '+r.replace(/^M[^C]*/,'');s+=` A${ws0},${ws0} 0 0 0 ${L[0][0].toFixed(1)},${L[0][1].toFixed(1)}Z`;return s;}

// ---------- cartoon object eyes (googly, with lids + brows) ----------
function oEye(id,r,lidCol){const c='e'+(UID++);DEFS+=`<clipPath id="${c}"><ellipse rx="${r*.92}" ry="${r}"/></clipPath>`;
  return `<g id="${id}"><ellipse rx="${r*.92}" ry="${r}" fill="#fff"/><g clip-path="url(#${c})"><circle id="${id}_p" r="${r*.46}" fill="#1b1717"/><circle id="${id}_h" r="${r*.15}" fill="#fff"/>
   <g id="${id}_lid"><rect x="${-r*2}" y="${-r*3}" width="${r*4}" height="${r*2}" fill="${lidCol}"/><line x1="${-r*2}" x2="${r*2}" y1="${-r}" y2="${-r}" ${LN2}/></g></g>
   <ellipse rx="${r*.92}" ry="${r}" fill="none" ${LN2}/></g>`;}
// lid: amount 0..1 (closed), tilt degrees ; look dx,dy
function setOEye(id,r,{dx=0,dy=0,lid=.12,tilt=0,blink=0,small=false}={}){const d=Math.hypot(dx,dy)||1,m=r*.42,k=Math.min(1,d/40);
  const px=dx/d*m*k,py=dy/d*m*k;const p=$(id+'_p');p.setAttribute('cx',px);p.setAttribute('cy',py);p.setAttribute('r',r*(small?.3:.46));
  const h=$(id+'_h');h.setAttribute('cx',px-r*.13);h.setAttribute('cy',py-r*.15);
  const L=Math.max(lid,blink);$(id+'_lid').setAttribute('transform',`rotate(${tilt}) translate(0,${L*2*r})`);}
function blinkK(t,ph){const k=(t+ph)%3.9;return k<.13?1-Math.abs(k-.065)/.065:0;}
function brow(id){return `<path id="${id}" fill="none" ${LN2}/>`;}
function setBrow(id,x,y,w,ang,arch=0){$(id).setAttribute('d',`M${x-w/2},${y} Q${x},${y-arch} ${x+w/2},${y}`);$(id).setAttribute('transform',`rotate(${ang},${x},${y})`);}
function mouthD(o,w,mood=0){ // mood: +1 smile, -1 frown
  if(o<.08){return {d:`M${-w*.7},0 Q0,${mood*w*.45} ${w*.7},0`,fill:'none'};}
  const h=3+o*w*1.25;return {d:`M${-w*.75},-1 Q0,${-2+mood*2} ${w*.75},-1 Q${w*.6},${h} 0,${h+1} Q${-w*.6},${h} ${-w*.75},-1Z`,fill:'#5e1a20'};}
function setMouth(id,o,w,mood=0){const m=mouthD(clamp(o),w,mood);const e=$(id);e.setAttribute('d',m.d);e.setAttribute('fill',m.fill);
  const t=$(id+'_t');if(t){t.setAttribute('opacity',o>=.25?1:0);t.setAttribute('cy',2+o*w*1.05);t.setAttribute('rx',w*.4);t.setAttribute('ry',o*w*.35);}}
function mouthEl(id,x,y){return `<g transform="translate(${x},${y})"><path id="${id}" ${LN2}/><path id="${id}_w" fill="#fff" opacity="0"/><ellipse id="${id}_t" cx="0" cy="0" rx="1" ry="1" fill="#d76d72" opacity="0"/></g>`;}

// ---------- data / lip sync ----------
const D=window.DATA, FPS=30;
function speak(who,T){for(const L of D.lines){if(L.who===who&&T>=L.t0&&T<L.t0+L.dur){return L.env[Math.floor((T-L.t0)*FPS)]||0;}}return 0;}
function lineT(id){return D.lines.find(l=>l.id===id).t0;}
function wordT(id,w,n=0){const L=D.lines.find(l=>l.id===id);const m=L.words.filter(x=>x[2]===w);return m[n]?m[n][0]:L.t0;}
function labelBox(id,text,x,y,sz=22){const w=text.length*sz*.66+26;return `<g id="${id}" opacity="0" transform="translate(${x},${y})"><rect x="${-w/2}" y="-20" width="${w}" height="40" fill="#fff" ${LN}/><text class="lbl" style="font-size:${sz}px" text-anchor="middle" y="8">${text}</text></g>`;}
// =============== 014: "the hidden tooth and the gold chain". Our own set, all code (013 v2 look) ===============
// Inside a mouth with braces. A canine tooth is asleep in a pocket in the upper gum, above the gap where it should be.
const OLW=`stroke="${INK}" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"`;
const OLW2=`stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"`;
const C_GUM='#ff9db3', C_GUM_L='#ffc2cf', C_GUM_D='#ee7f99', C_CAV='#8f2440', C_TOOTH='#ffffff', C_TOOTH_S='#d7e3ee', C_GOLD='#f6c12d', C_GOLD_D='#c98c11', C_STEEL='#b9c3cf', C_TEAL='#14a3a0';
const UPX=[55,205,515,665], GAP=360, UTOP=455, WIRE=633;       // upper teeth centres, the empty seat, where they leave the gum, the wire
const TOOTH_D='M-68,0 L68,0 C76,90 72,172 54,206 C32,232 -32,232 -54,206 C-72,172 -76,90 -68,0Z';
const CAN_D='M-56,-70 C-62,-118 62,-118 56,-70 L50,22 C44,62 14,94 0,104 C-14,94 -44,62 -50,22 Z';
const bracket=(x,y)=>`<g transform="translate(${x},${y})"><rect x="-19" y="-15" width="38" height="30" rx="6" fill="${C_STEEL}" ${OLW2}/><rect x="-10" y="-7" width="20" height="14" rx="3" fill="#8793a3" stroke="${INK}" stroke-width="1.6"/></g>`;
function toothSVG(id,x,face){
  return `<g id="${id}" transform="translate(${x},${UTOP})">${shaded(TOOTH_D,C_TOOTH,C_TOOTH_S,16)}
   ${face?`<g transform="translate(-27,80)">${oEye(id+'_eL',22,'#fff')}</g><g transform="translate(27,80)">${oEye(id+'_eR',22,'#fff')}</g>${brow(id+'_bL')}${brow(id+'_bR')}${mouthEl(id+'_m',0,134)}`
     :`<circle cx="-24" cy="84" r="15" fill="#fff" ${OLW2}/><circle cx="24" cy="84" r="15" fill="#fff" ${OLW2}/><circle id="${id}_pL" cx="-24" cy="78" r="6.5" fill="${INK}"/><circle id="${id}_pR" cx="24" cy="78" r="6.5" fill="${INK}"/><path d="M-10,128 Q0,134 10,128" fill="none" ${OLW2}/>`}
   ${bracket(0,WIRE-UTOP)}</g>`;}
function mouthWorld(){
  DEFS+=`<clipPath id="pocketC"><ellipse cx="${GAP}" cy="250" rx="100" ry="118"/></clipPath>`;
  let s=`<g id="wMouth"><rect x="-400" y="-500" width="1520" height="2400" fill="${C_CAV}"/>
   <ellipse cx="360" cy="1010" rx="470" ry="250" fill="#f26f86" ${OLW}/><path d="M360,800 C352,900 356,1000 360,1100" fill="none" stroke="#d9546e" stroke-width="6" stroke-linecap="round"/>
   <ellipse cx="200" cy="900" rx="90" ry="40" fill="#f88ea1" opacity=".7"/>`;
  // lower teeth and gum
  s+=`<g id="lowT">${[30,180,330,480,630,780].map((x,i)=>`<g transform="translate(${x},1075) scale(1,-1)">${shaded('M-70,0 L70,0 C76,80 72,150 56,178 C34,198 -34,198 -56,178 C-72,150 -76,80 -70,0Z',C_TOOTH,C_TOOTH_S,14)}</g>${bracket(x,985)}`).join('')}
    <path d="M-400,985 H1120" stroke="${INK}" stroke-width="7"/><path d="M-400,985 H1120" stroke="${C_STEEL}" stroke-width="3.5"/></g>
   <path d="M-400,1500 L-400,1062 ${[-45,105,255,405,555,705,855].map(x=>`Q${x-37},1088 ${x},1040 Q${x+37},1088 ${x+75},1062`).join(' ')} L1120,1062 L1120,1500 Z" fill="${C_GUM}" ${OLW}/>`;
  // upper gum, the pocket in it
  s+=`<rect x="-400" y="-500" width="1520" height="980" fill="${C_GUM}"/><ellipse cx="150" cy="120" rx="260" ry="120" fill="${C_GUM_L}" opacity=".55"/><ellipse cx="640" cy="330" rx="150" ry="70" fill="${C_GUM_L}" opacity=".4"/>
   ${UPX.map(x=>toothSVG('t'+x,x,x===205||x===515)).join('')}
   <path id="wire" d="M-400,${WIRE} H1120" stroke="${INK}" stroke-width="7"/><path d="M-400,${WIRE} H1120" stroke="${C_STEEL}" stroke-width="3.5"/>
   <path d="M-400,-500 L-400,486 L-88,486 ${[55,205].map(x=>`Q${x-70},508 ${x},462 Q${x+70},508 ${x+75},486`).join(' ')} L440,486 ${[515,665].map(x=>`Q${x-70},508 ${x},462 Q${x+70},508 ${x+75},486`).join(' ')} L1120,486 L1120,-500 Z" fill="${C_GUM}"/>
   <path d="M-400,486 L-88,486 ${[55,205].map(x=>`Q${x-70},508 ${x},462 Q${x+70},508 ${x+75},486`).join(' ')} L440,486 ${[515,665].map(x=>`Q${x-70},508 ${x},462 Q${x+70},508 ${x+75},486`).join(' ')} L1120,486" fill="none" ${OLW}/>
   <g id="sign" opacity="0"><path d="M-36,-34 V-6 M36,-34 V-6" stroke="${INK}" stroke-width="3"/><rect x="-62" y="-8" width="124" height="40" rx="7" fill="#fff7d6" ${OLW2}/><text y="19" text-anchor="middle" style="font-family:LG,sans-serif;font-size:21px;letter-spacing:.5px" fill="#d9562f">RESERVED</text></g>
   <g id="pocket" opacity="0"><ellipse cx="${GAP}" cy="250" rx="100" ry="118" fill="#c9506d" ${OLW}/><ellipse cx="${GAP}" cy="250" rx="90" ry="108" fill="none" stroke="#f6e3bf" stroke-width="10" stroke-dasharray="26 12" opacity=".9"/><ellipse cx="${GAP}" cy="262" rx="78" ry="92" fill="#a93655" opacity=".55"/></g>
   <g id="can">${shaded(CAN_D,C_TOOTH,C_TOOTH_S,16)}<g transform="translate(-22,-44)">${oEye('c_eL',19,'#fff')}</g><g transform="translate(22,-44)">${oEye('c_eR',19,'#fff')}</g>${brow('c_bL')}${brow('c_bR')}${mouthEl('c_m',0,2)}
     <g id="cBrk" opacity="0">${bracket(0,58)}</g><g id="btn" opacity="0"><circle cx="0" cy="60" r="14" fill="${C_GOLD}" ${OLW2}/><circle cx="0" cy="60" r="5.5" fill="${C_GOLD_D}"/></g></g>
   <path id="chO" fill="none" stroke="${INK}" stroke-width="12" stroke-linecap="round" stroke-dasharray="15 7"/><path id="chG" fill="none" stroke="${C_GOLD}" stroke-width="7.5" stroke-linecap="round" stroke-dasharray="15 7"/><path id="chH" fill="none" stroke="#fff3b0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 16"/>
   <g id="flap"><ellipse cx="${GAP}" cy="250" rx="102" ry="120" fill="${C_GUM_L}" ${OLW}/><ellipse cx="${GAP-26}" cy="210" rx="34" ry="46" fill="#fff" opacity=".35"/></g>
   <g id="glow"></g><g id="zz"></g><g id="fx"></g>
   <g id="scalpel"><path d="M0,0 L20,-58 L34,-54 L16,-4 Z" fill="#e9eef4" ${OLW2}/><path d="M22,-56 L74,-196 L94,-188 L40,-50 Z" fill="${C_STEEL}" ${OLW2}/><path d="M40,-92 L60,-146" stroke="#8793a3" stroke-width="5" stroke-linecap="round"/></g>
   <g id="tweez" opacity="0"><path d="M0,0 L120,-170 L132,-160 L10,6 Z" fill="${C_STEEL}" ${OLW2}/><path d="M6,8 L140,-150 L150,-138 L12,14 Z" fill="#d9e0e8" ${OLW2}/></g></g>`;
  return s;}
function docBubble(){
  DEFS+=`<clipPath id="dbC"><circle r="92"/></clipPath>`;
  return `<g id="docB" opacity="0"><circle r="100" cx="5" cy="7" fill="#000" opacity=".16"/><circle r="92" fill="#e8f7f5"/><g clip-path="url(#dbC)"><g transform="translate(0,-92) scale(1.02)">${doctorSVG()}</g></g>
   <circle r="92" fill="none" stroke="${C_TEAL}" stroke-width="10"/><circle r="97" fill="none" stroke="${INK}" stroke-width="3.4"/><circle r="87" fill="none" stroke="${INK}" stroke-width="2.4"/>
   <g transform="translate(0,104)"><rect x="-72" y="-17" width="144" height="34" rx="17" fill="#fff" ${OLW2}/><text y="8" text-anchor="middle" style="font-family:LG,sans-serif;font-size:21px;letter-spacing:.5px" fill="#0b6e6b">GIGGLEMD</text></g></g>`;}
// ---------------- the dental clinic: our doctor beside our patient in the dental chair ----------------
function clinic14(){
  DEFS+=`<clipPath id="patTop"><rect x="-200" y="-60" width="400" height="582"/></clipPath>`;
  const cush='#7fd0cc',shell='#eef2f6',shellS='#cfd8e2';
  return `<rect x="-60" y="-60" width="840" height="1400" fill="#e8f7f5"/>
   <rect x="640" y="-60" width="140" height="1230" fill="#f7fdfc" ${OLW}/>
   <g transform="translate(262,52)"><rect x="0" y="0" width="304" height="192" fill="#2b3b3b" ${OLW}/>${[0,1,2,3].map(i=>`<rect x="10" y="${10+i*45}" width="284" height="36" fill="#c6d4d2"/><rect x="10" y="${36+i*45}" width="284" height="8" fill="#8b9b99"/>`).join('')}</g>
   <rect x="-10" y="300" width="60" height="880" fill="#14a3a0" ${OLW}/>
   <rect x="-60" y="1150" width="840" height="200" fill="#cfe3e1"/><path d="M-60,1150 H780" ${OLW}/>
   <g transform="translate(360,1150) scale(1.15) translate(-385,-1150)"><g transform="translate(150,338) scale(1.0)">${doctorSVG()}</g>
   <g id="mirror"><path d="M0,0 L58,-26" stroke="${INK}" stroke-width="9" stroke-linecap="round"/><path d="M0,0 L58,-26" stroke="${C_STEEL}" stroke-width="5" stroke-linecap="round"/><circle cx="66" cy="-30" r="12" fill="#eaf6ff" ${OLW2}/></g>
   <ellipse cx="390" cy="1158" rx="170" ry="16" fill="#000" opacity=".12"/>
   <path d="M330,1000 L450,1000 L474,1140 L306,1140 Z" fill="${shellS}" ${OLW}/><rect x="270" y="1132" width="240" height="24" rx="10" fill="#b9c3cf" ${OLW}/>
   <path d="M404,990 L600,470" stroke="${INK}" stroke-width="168" stroke-linecap="round"/><path d="M404,990 L600,470" stroke="${shell}" stroke-width="161" stroke-linecap="round"/><path d="M414,950 L590,500" stroke="${cush}" stroke-width="112" stroke-linecap="round"/>
   <path d="M246,972 L470,972" stroke="${INK}" stroke-width="76" stroke-linecap="round"/><path d="M246,972 L470,972" stroke="${shell}" stroke-width="69" stroke-linecap="round"/>
   <path d="M250,990 L84,1096" stroke="${INK}" stroke-width="66" stroke-linecap="round"/><path d="M250,990 L84,1096" stroke="${shell}" stroke-width="59" stroke-linecap="round"/><path d="M240,984 L96,1076" stroke="${cush}" stroke-width="30" stroke-linecap="round"/>
   <g id="patWrap"><g transform="translate(540,470) rotate(18) scale(.92)"><g clip-path="url(#patTop)">${patientSVG()}</g></g>
    <path d="M396,930 L262,948 L104,1052" fill="none" stroke="${INK}" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/><path d="M396,930 L262,948 L104,1052" fill="none" stroke="#4b6286" stroke-width="63" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M118,1016 C92,1000 60,1016 56,1050 C54,1074 70,1092 92,1090 L128,1064 Z" fill="#f2f2f2" ${OLW}/></g>
   <path d="M352,884 L520,858" stroke="${INK}" stroke-width="40" stroke-linecap="round"/><path d="M352,884 L520,858" stroke="${shell}" stroke-width="33" stroke-linecap="round"/></g>`;}

// =============== SCENE 2 : ENT clinic ===============
function hand(x,y,ang,sc,skin,id=''){return `<g ${id?`id="${id}"`:''} transform="translate(${x},${y}) rotate(${ang}) scale(${sc})">
  <path d="M-11,-12 C-4,-17 9,-16 13,-8 C17,2 15,14 6,18 C-4,22 -14,16 -16,6 C-17,-2 -15,-8 -11,-12 Z" fill="${skin}" ${LN2}/>
  <path d="M-12,-6 C-20,-12 -24,-6 -18,2" fill="${skin}" ${LN2}/><path d="M-2,4 q4,6 10,6 M0,-4 q5,5 12,5" ${TH('#9c6b52')}/></g>`;}
function humanEye(id,x,y,w,h){const c='h'+(UID++);DEFS+=`<clipPath id="${c}"><path d="M${-w},0 Q0,${-h*1.5} ${w},0 Q0,${h*1.1} ${-w},0Z"/></clipPath>`;
  return `<g transform="translate(${x},${y})"><g id="${id}"><path d="M${-w},0 Q0,${-h*1.5} ${w},0 Q0,${h*1.1} ${-w},0Z" fill="#fff"/>
   <g clip-path="url(#${c})"><circle id="${id}_p" r="${h*.78}" fill="#3a2a20"/><circle id="${id}_q" r="${h*.38}" fill="#111"/><circle id="${id}_h" r="${h*.2}" fill="#fff"/></g>
   <path d="M${-w-1},0 Q0,${-h*1.55} ${w+1},0" fill="none" stroke="${INK}" stroke-width="2.8" stroke-linecap="round" ${VE}/><path d="M${-w*.8},${h*.35} Q0,${h*1.05} ${w*.8},${h*.35}" fill="none" ${TH('#8d6a5a')}/></g></g>`;}
function setHEye(id,dx,blink){const p=$(id+'_p'),q=$(id+'_q'),h=$(id+'_h');[p,q].forEach(e=>{e.setAttribute('cx',dx);e.setAttribute('cy',1);});h.setAttribute('cx',dx-2);h.setAttribute('cy',-1.5);
  $(id).setAttribute('transform',`scale(1,${1-blink*.92})`);}

const DSK='#f0c6a6', DSK_S='#d9a585', DHAIR='#3b2820';
function doctorSVG(){return `<g id="doc">
 <ellipse cx="0" cy="782" rx="92" ry="12" fill="#000" opacity=".12"/>
 <!-- back hair -->
 <path d="M-64,70 C-74,130 -70,190 -48,214 L50,214 C70,190 74,130 64,70 Z" fill="${DHAIR}" ${LN}/>
 <!-- legs -->
 ${shaded(limbD([[-30,500],[-34,640],[-34,760]],[52,44,38]),'#33465f','#22324a',10)}
 ${shaded(limbD([[30,500],[34,640],[36,760]],[52,44,38]),'#33465f','#22324a',10)}
 <path d="M-58,756 C-58,744 -12,742 -10,756 L-10,772 L-62,774 Z" fill="#3c3f46" ${LN2}/><path d="M12,756 C14,742 60,744 60,756 L62,774 L10,772 Z" fill="#3c3f46" ${LN2}/>
 <!-- scrubs + coat -->
