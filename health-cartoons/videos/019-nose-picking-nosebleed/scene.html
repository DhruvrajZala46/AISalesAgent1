<script>
// =============== helpers ===============
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const eob=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const INK='#2a2322';
const VE='vector-effect="non-scaling-stroke"';
const LN=`stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" ${VE}`;
const LN2=`stroke="${INK}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${VE}`;
const TH=(c)=>`stroke="${c}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none" ${VE}`;
function tr(id,x,y,sx=1,sy=sx,r=0){const e=$(id);if(e)e.setAttribute('transform',`translate(${x},${y}) rotate(${r}) scale(${sx},${sy})`);}
function show(id,v){const e=$(id);if(e)e.setAttribute('opacity',v);}
let DEFS='', UID=0;
// shape with airbrushed inner shading (soft darker edge), like the reference
function shaded(d,fill,shade,w=16,extra=''){const id='c'+(UID++);DEFS+=`<clipPath id="${id}"><path d="${d}"/></clipPath>`;
  return `<path d="${d}" fill="${fill}"/><g clip-path="url(#${id})"><path d="${d}" fill="none" stroke="${shade}" stroke-width="${w}" filter="url(#soft)" opacity=".9"/></g><path d="${d}" fill="none" ${LN} ${extra}/>`;}
// Catmull-Rom smooth path through points
function smooth(pts,closed=false){let s=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;const n=pts.length;
  for(let i=0;i<n-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(n-1,i+2)];
    s+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}
  return s;}
// tapered limb around a centre line (shoulder, elbow, wrist)
function limbD(pts,ws){const L=[],R=[];const n=pts.length;
  for(let i=0;i<n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    const w=ws[i]/2;L.push([pts[i][0]-dy*w,pts[i][1]+dx*w]);R.push([pts[i][0]+dy*w,pts[i][1]-dx*w]);}
  const we=ws[n-1]/2, ws0=ws[0]/2;
  let s=smooth(L);s+=` A${we},${we} 0 0 0 ${R[n-1][0].toFixed(1)},${R[n-1][1].toFixed(1)}`;
  const r=smooth(R.slice().reverse());s+=' '+r.replace(/^M[^C]*/,'');s+=` A${ws0},${ws0} 0 0 0 ${L[0][0].toFixed(1)},${L[0][1].toFixed(1)}Z`;return s;}

// ---------- cartoon object eyes (googly, with lids + brows) ----------
function oEye(id,r,lidCol){const c='e'+(UID++);DEFS+=`<clipPath id="${c}"><ellipse rx="${r*.92}" ry="${r}"/></clipPath>`;
  return `<g id="${id}"><ellipse rx="${r*.92}" ry="${r}" fill="#fff"/><g clip-path="url(#${c})"><circle id="${id}_p" r="${r*.46}" fill="#1b1717"/><circle id="${id}_h" r="${r*.15}" fill="#fff"/>
   <g id="${id}_lid"><rect x="${-r*2}" y="${-r*3}" width="${r*4}" height="${r*2}" fill="${lidCol}"/><line x1="${-r*2}" x2="${r*2}" y1="${-r}" y2="${-r}" ${LN2}/></g></g>
   <ellipse rx="${r*.92}" ry="${r}" fill="none" ${LN2}/></g>`;}
// lid: amount 0..1 (closed), tilt degrees ; look dx,dy
function setOEye(id,r,{dx=0,dy=0,lid=.12,tilt=0,blink=0,small=false}={}){const d=Math.hypot(dx,dy)||1,m=r*.42,k=Math.min(1,d/40);
  const px=dx/d*m*k,py=dy/d*m*k;const p=$(id+'_p');p.setAttribute('cx',px);p.setAttribute('cy',py);p.setAttribute('r',r*(small?.3:.46));
  const h=$(id+'_h');h.setAttribute('cx',px-r*.13);h.setAttribute('cy',py-r*.15);
  const L=Math.max(lid,blink);$(id+'_lid').setAttribute('transform',`rotate(${tilt}) translate(0,${L*2*r})`);}
function blinkK(t,ph){const k=(t+ph)%3.9;return k<.13?1-Math.abs(k-.065)/.065:0;}
function brow(id){return `<path id="${id}" fill="none" ${LN2}/>`;}
function setBrow(id,x,y,w,ang,arch=0){$(id).setAttribute('d',`M${x-w/2},${y} Q${x},${y-arch} ${x+w/2},${y}`);$(id).setAttribute('transform',`rotate(${ang},${x},${y})`);}
function mouthD(o,w,mood=0){ // mood: +1 smile, -1 frown
  if(o<.08){return {d:`M${-w*.7},0 Q0,${mood*w*.45} ${w*.7},0`,fill:'none'};}
  const h=3+o*w*1.25;return {d:`M${-w*.75},-1 Q0,${-2+mood*2} ${w*.75},-1 Q${w*.6},${h} 0,${h+1} Q${-w*.6},${h} ${-w*.75},-1Z`,fill:'#5e1a20'};}
function setMouth(id,o,w,mood=0){const m=mouthD(clamp(o),w,mood);const e=$(id);e.setAttribute('d',m.d);e.setAttribute('fill',m.fill);
  const t=$(id+'_t');if(t){t.setAttribute('opacity',o>=.25?1:0);t.setAttribute('cy',2+o*w*1.05);t.setAttribute('rx',w*.4);t.setAttribute('ry',o*w*.35);}}
function mouthEl(id,x,y){return `<g transform="translate(${x},${y})"><path id="${id}" ${LN2}/><path id="${id}_w" fill="#fff" opacity="0"/><ellipse id="${id}_t" cx="0" cy="0" rx="1" ry="1" fill="#d76d72" opacity="0"/></g>`;}

// ---------- data / lip sync ----------
const D=window.DATA, FPS=30;
function speak(who,T){for(const L of D.lines){if(L.who===who&&T>=L.t0&&T<L.t0+L.dur){return L.env[Math.floor((T-L.t0)*FPS)]||0;}}return 0;}
function lineT(id){return D.lines.find(l=>l.id===id).t0;}
function wordT(id,w,n=0){const L=D.lines.find(l=>l.id===id);const m=L.words.filter(x=>x[2]===w);return m[n]?m[n][0]:L.t0;}
function labelBox(id,text,x,y,sz=22){const w=text.length*sz*.66+26;return `<g id="${id}" opacity="0" transform="translate(${x},${y})"><rect x="${-w/2}" y="-20" width="${w}" height="40" fill="#fff" ${LN}/><text class="lbl" style="font-size:${sz}px" text-anchor="middle" y="8">${text}</text></g>`;}
// =============== 019: how picking your nose makes it bleed. The reference's scenes; our drawings, all code ===============
const OLW=`stroke="${INK}" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"`;
const OLW2=`stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"`;
const C_SK='#f9e6cf', C_SK_S='#e6c9a6', C_CAV='#a8323c', C_CAV_S='#7c1f2a', C_BLOOD='#e02634', C_TEAL='#14a3a0';
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const CAV_D='M566,236 C622,236 650,320 654,430 L660,716 C660,790 606,812 520,804 L176,792 C96,786 84,716 150,646 C284,494 440,324 506,262 C524,244 544,236 566,236 Z';
const fingerSVG=(w,len)=>`<path d="M${-w/2},${len} L${-w/2},${w*.5} C${-w/2},${-w*.2} ${w/2},${-w*.2} ${w/2},${w*.5} L${w/2},${len} Z" fill="${C_SK}" ${OLW}/><path d="M${-w*.3},${w*.5} C${-w*.3},${w*.1} ${w*.3},${w*.1} ${w*.3},${w*.5} L${w*.3},${w*.95} L${-w*.3},${w*.95} Z" fill="#fde9da" ${OLW2}/><path d="M${-w*.3},${w*1.9} h${w*.6} M${-w*.26},${w*2.1} h${w*.52}" stroke="${C_SK_S}" stroke-width="4" stroke-linecap="round"/>`;
const card=(inner,txt)=>`<g id="inset"><rect x="16" y="130" width="196" height="330" rx="18" fill="#fff" ${OLW}/>${inner}<text x="114" y="440" text-anchor="middle" style="font-family:LG,sans-serif;font-size:20px" fill="#1d2a44">${txt}</text></g>`;

  DEFS+=`<clipPath id="cavC"><path d="${CAV_D}"/></clipPath>`;

   <path d="M520,-40 C440,200 240,520 56,700 C-20,776 -6,890 110,940 C230,990 400,1010 470,1000 C430,1060 400,1160 440,1330 L770,1330 L770,-40 Z" fill="${C_SK}" ${OLW}/>

    <path d="M440,560 l16,-14 l12,12 l-8,18 l-16,2 Z" fill="#a9ad5c"/>
    <g id="scratch" opacity="0"><path d="M372,664 l22,-18 l14,16 l24,-14 l16,22 l-10,26 l14,24 l-22,18 l-20,-10 l-24,16 l-14,-24 l-18,-8 l10,-26 Z" fill="#8e1420"/><path d="M392,690 l14,10 M420,676 l-6,16 M410,716 l16,-6" stroke="#5f0c16" stroke-width="5" stroke-linecap="round"/></g>
    <g id="blood1"></g></g>

   <g id="blood1b"></g>
   <g id="lface" transform="translate(548,420)"><g transform="translate(-36,0)">${oEye('ln_eL',33,C_CAV)}</g><g transform="translate(36,0)">${oEye('ln_eR',33,C_CAV)}</g>${brow('ln_bL')}${brow('ln_bR')}${mouthEl('ln_m',0,70)}</g>
   <g id="booger"><path d="M-46,-6 l14,-34 l30,-12 l34,10 l22,30 l-8,36 l-30,22 l-36,-2 l-24,-22 Z" fill="#a9ad5c" ${OLW2}/><path d="M-18,-18 l20,-8 l18,12 M-12,14 l22,6 l16,-14" fill="none" stroke="#868a3c" stroke-width="4" stroke-linecap="round"/></g>
   <g id="finger">${fingerSVG(128,1100)}</g><g id="drip1"></g>`;}
// ---- scene 2: the nose from the front ----
function frontNose(){
  const handL=`<path d="M-360,640 C-350,360 -280,80 -196,-30 C-170,-64 -122,-44 -132,0 C-156,100 -176,240 -160,640 Z" fill="${C_SK}" ${OLW}/><path d="M-178,-14 C-166,-34 -142,-26 -146,-4 L-156,40 L-190,30 Z" fill="#fdf1e2" ${OLW2}/><path d="M-250,140 q40,10 70,-6 M-262,200 q40,10 74,-4" fill="none" stroke="${C_SK_S}" stroke-width="5" stroke-linecap="round"/>`;

   <g id="drip2"></g><g id="sniff"></g>

     <path d="M-44,20 C-56,-14 -30,-44 0,-40 C22,-58 56,-40 54,-12 C74,6 62,40 36,44 C22,62 -10,62 -22,44 C-44,48 -56,34 -44,20 Z" fill="#fff" ${OLW2}/><g id="plugRed"></g>
     <g transform="translate(40,-40) scale(1.6)"><g transform="translate(-17,0)">${oEye('tp_eL',18,'#fff')}</g><g transform="translate(17,0)">${oEye('tp_eR',18,'#fff')}</g>${brow('tp_bL')}${brow('tp_bR')}${mouthEl('tp_m',-2,30)}</g></g>
   <g id="wipe"><path d="M-190,-40 C-150,-120 -60,-80 0,-120 C60,-80 150,-120 190,-40 L250,640 L-250,640 Z" fill="#fff" ${OLW}/><path d="M-90,-40 q30,200 -20,660 M10,-80 q30,300 10,700 M100,-40 q-10,240 40,660" fill="none" stroke="#dfe3e8" stroke-width="7" stroke-linecap="round"/><g id="wipeRed"></g>
     ${handL}<g transform="scale(-1,1)">${handL}</g></g></g>`;}
// ---- scene 3: lean forward and pinch (close on the nose and mouth) ----
function profile(){
  return `<rect x="-40" y="-40" width="800" height="1360" fill="#ddf3fb"/>
   <g id="head"><path d="M1300,-300 L560,-300 L540,-80 C520,60 486,200 446,300 L282,452 C250,482 262,520 308,524 L352,528 C340,580 330,604 352,630 C328,656 336,682 362,690 C350,740 362,800 424,850 C510,920 566,1020 586,1700 L1300,1700 Z" fill="${C_SK}" ${OLW}/>

// ---- scene 5: the clinic (the reference's two-shot: desk, doctor, patient holding the stained tissue) ----
function clinic19(){
  return `<rect x="-60" y="-60" width="840" height="1400" fill="#b9c58c"/><rect x="-60" y="180" width="840" height="56" fill="#a4996c"/>
   <path d="M-60,900 H780 V1400 H-60 Z" fill="#9a8f80"/><path d="M-60,900 H780 M-60,1030 H780 M-60,1190 H780 M120,900 L40,1340 M330,900 L300,1340 M520,900 L560,1340 M690,900 L780,1300" stroke="#6f665b" stroke-width="3" fill="none"/>
   <g transform="translate(170,430) scale(1.25)">${doctorSVG()}</g>
   <path d="M-60,760 H350 V800 H-60 Z" fill="#b89a86" ${OLW}/><path d="M160,800 H330 V1180 H160 Z" fill="#b39581" ${OLW}/><path d="M-60,800 H160" ${OLW}/>
   <g id="patWrap"><path d="M470,900 L462,1180 L530,1180 L548,960 L566,1180 L636,1180 L630,900 Z" fill="#2b2b30" ${OLW}/><path d="M446,1180 q40,-26 90,0 v22 h-90 Z M560,1180 q44,-26 90,0 v22 h-90 Z" fill="#17171a" ${OLW2}/>
    <g transform="translate(548,500) scale(1.25)">${patientSVG()}</g>

// =============== SCENE 2 : ENT clinic ===============
function hand(x,y,ang,sc,skin,id=''){return `<g ${id?`id="${id}"`:''} transform="translate(${x},${y}) rotate(${ang}) scale(${sc})">
  <path d="M-11,-12 C-4,-17 9,-16 13,-8 C17,2 15,14 6,18 C-4,22 -14,16 -16,6 C-17,-2 -15,-8 -11,-12 Z" fill="${skin}" ${LN2}/>
  <path d="M-12,-6 C-20,-12 -24,-6 -18,2" fill="${skin}" ${LN2}/><path d="M-2,4 q4,6 10,6 M0,-4 q5,5 12,5" ${TH('#9c6b52')}/></g>`;}
function humanEye(id,x,y,w,h){const c='h'+(UID++);DEFS+=`<clipPath id="${c}"><path d="M${-w},0 Q0,${-h*1.5} ${w},0 Q0,${h*1.1} ${-w},0Z"/></clipPath>`;
  return `<g transform="translate(${x},${y})"><g id="${id}"><path d="M${-w},0 Q0,${-h*1.5} ${w},0 Q0,${h*1.1} ${-w},0Z" fill="#fff"/>
   <g clip-path="url(#${c})"><circle id="${id}_p" r="${h*.78}" fill="#3a2a20"/><circle id="${id}_q" r="${h*.38}" fill="#111"/><circle id="${id}_h" r="${h*.2}" fill="#fff"/></g>
   <path d="M${-w-1},0 Q0,${-h*1.55} ${w+1},0" fill="none" stroke="${INK}" stroke-width="2.8" stroke-linecap="round" ${VE}/><path d="M${-w*.8},${h*.35} Q0,${h*1.05} ${w*.8},${h*.35}" fill="none" ${TH('#8d6a5a')}/></g></g>`;}
function setHEye(id,dx,blink){const p=$(id+'_p'),q=$(id+'_q'),h=$(id+'_h');[p,q].forEach(e=>{e.setAttribute('cx',dx);e.setAttribute('cy',1);});h.setAttribute('cx',dx-2);h.setAttribute('cy',-1.5);
  $(id).setAttribute('transform',`scale(1,${1-blink*.92})`);}

const DSK='#f0c6a6', DSK_S='#d9a585', DHAIR='#3b2820';
function doctorSVG(){return `<g id="doc">
 <ellipse cx="0" cy="782" rx="92" ry="12" fill="#000" opacity=".12"/>
 <!-- back hair -->
 <path d="M-64,70 C-74,130 -70,190 -48,214 L50,214 C70,190 74,130 64,70 Z" fill="${DHAIR}" ${LN}/>
 <!-- legs -->
 ${shaded(limbD([[-30,500],[-34,640],[-34,760]],[52,44,38]),'#33465f','#22324a',10)}
 ${shaded(limbD([[30,500],[34,640],[36,760]],[52,44,38]),'#33465f','#22324a',10)}
 <path d="M-58,756 C-58,744 -12,742 -10,756 L-10,772 L-62,774 Z" fill="#3c3f46" ${LN2}/><path d="M12,756 C14,742 60,744 60,756 L62,774 L10,772 Z" fill="#3c3f46" ${LN2}/>
 <!-- scrubs + coat -->
 ${shaded('M-62,214 C-40,204 40,204 62,214 L70,520 L-70,520 Z','#3f9c96','#2c7d78',14)}
 ${shaded('M-20,206 L-62,212 C-92,222 -100,250 -102,290 L-110,560 L-46,566 L-16,330 L-8,250 Z','#f8f8f6','#d4d9dd',18)}
 ${shaded('M20,206 L62,212 C92,222 100,250 102,290 L110,560 L46,566 L16,330 L8,250 Z','#f8f8f6','#d4d9dd',18)}
 <path d="M-20,206 L-2,262 L-8,330 M20,206 L2,262 L8,330" fill="none" ${TH('#9aa3aa')}/>
 <path d="M-90,430 h34 v40 h-34 Z M56,430 h34 v40 h-34 Z" fill="none" ${TH('#9aa3aa')}/>

// =============== 019: "How picking your nose makes it bleed". Inside the nose, the nose from the front, the pinch, the clinic. ===============
const E=D.ev, ST=D.start, END=D.end;
function viseme(env,T,seed){if(env<0.08)return 'closed';const f=Math.floor(T*15)+seed;let b=env<0.3?'small':env<0.65?'mid':'wide';if(b==='mid'&&f%4===0)b='oo';if(b==='wide'&&f%5===0)b='mid';return b;}
function setMouthV(id,env,w,mood,T,seed=0){const v=viseme(env,T,seed);const e=$(id),t=$(id+'_t'),th=$(id+'_w');let d,fill='#5e1a20',tong=0,teeth=0;
  if(v==='closed'){d=`M${-w*.7},0 Q0,${mood*w*.45} ${w*.7},0`;fill='none';}
  else if(v==='small'){d=`M${-w*.55},0 Q0,-2.5 ${w*.55},0 Q0,${w*.5} ${-w*.55},0Z`;}
  else if(v==='oo'){d=`M0,${-w*.32} C${w*.42},${-w*.32} ${w*.42},${w*.55} 0,${w*.55} C${-w*.42},${w*.55} ${-w*.42},${-w*.32} 0,${-w*.32}Z`;}
  else if(v==='mid'){d=`M${-w*.8},-1 Q0,-4 ${w*.8},-1 Q${w*.6},${w*.85} 0,${w*.9} Q${-w*.6},${w*.85} ${-w*.8},-1Z`;tong=.6;teeth=1;}
  else {d=`M${-w*.9},-2 Q0,-6 ${w*.9},-2 Q${w*.7},${w*1.3} 0,${w*1.35} Q${-w*.7},${w*1.3} ${-w*.9},-2Z`;tong=1;teeth=1;}
  e.setAttribute('d',d);e.setAttribute('fill',fill);
  if(th){th.setAttribute('opacity',teeth);th.setAttribute('d',`M${-w*.62},-1 Q0,-4 ${w*.62},-1 L${w*.56},${w*.2} Q0,${w*.12} ${-w*.56},${w*.2}Z`);}
  if(t){t.setAttribute('opacity',tong?1:0);t.setAttribute('cy',w*(tong>.8?1.0:.66));t.setAttribute('rx',w*.45);t.setAttribute('ry',w*.2*tong+1);}}

function renderInside(T){
  const picked=T>=E.pick,pull=eio(P(T,E.pick+.05,E.pick+.6)),bleed=T>=E.bleed,lt=speak('lining',T);
  // the finger comes up through the nostril, scrapes the dry mucus off and pulls it out
  const up=eo(P(T,0,.28)),wig=picked?0:Math.sin(T*30)*8;

  $('finger').setAttribute('transform',`translate(${fx.toFixed(1)},${fy.toFixed(1)}) rotate(${(-7+pull*4).toFixed(1)})`);
  mv('booger',lerp(WX,fx,clamp(pull*5)),lerp(WY,fy-40,clamp(pull*5)),pull*50,1.25);show('booger',pull<.97?1:0);

  $('lface').setAttribute('transform',`translate(${(548+(picked&&T<E.pick+.6?Math.sin(T*50)*5:0)).toFixed(1)},${(420+Math.sin(T*2.4)*4).toFixed(1)}) scale(1.35)`);}
// ---------- scene 2 ----------
const dripStarts=[[E.front+.1,E.wipe1+.2],[E.wipe1+.9,E.wipe2+.2],[E.wipe2+.9,E.pinch]];
function renderFront(T){
  let L=0;for(const [a,b] of dripStarts)if(T>=a&&T<b)L=eo(P(T,a,a+1.8))*210+Math.sin(T*3)*4;
  if(T>=E.wipe2-.6&&T<E.wipe2-.1)L*=1-.5*Math.sin(P(T,E.wipe2-.6,E.wipe2-.1)*Math.PI);
  const plugOn=T>=E.plug,pk=eo(P(T,E.plug,E.plug+.5)),tT=speak('tissue',T);
  let d='';if(L>4){const y=756+L,s=Math.sin(T*5)*3;d+=`<path d="M418,752 C414,${756+L*.5} ${424+s},${756+L*.7} 420,${y-10} q6,30 18,6 q8,32 22,8 q10,20 18,-12 C${486-s},${756+L*.7} 494,${756+L*.5} 492,752 Z" fill="#e5484d"/><path d="M420,752 q36,26 72,0 Z" fill="#b3202b"/>`;}
  $('drip2').innerHTML=d;
  // both hands wipe with a tissue from below; it leaves with a red stain
  let wOn=false;[E.wipe1,E.wipe2].forEach((t0)=>{if(T>=t0-.35&&T<t0+.9){wOn=true;const a=eo(P(T,t0-.35,t0)),o=eio(P(T,t0+.45,t0+.9)),sw=Math.sin(clamp(P(T,t0,t0+.45))*Math.PI*3)*26;
    mv('wipe',400+sw,lerp(1500,850,a)+o*700,sw*.1,1);

  show('wipe',wOn?1:0);
  let sn='';if(T>=E.wipe2-.6&&T<E.wipe2-.1){const k=P(T,E.wipe2-.6,E.wipe2-.1);[0,1,2].forEach(j=>{sn+=`<path d="M${385},${1060-j*30-k*40} q70,-34 140,0" fill="none" stroke="${INK}" stroke-width="20" stroke-linecap="round" opacity="${(1-k).toFixed(2)}"/><path d="M${385},${1060-j*30-k*40} q70,-34 140,0" fill="none" stroke="#fff01f" stroke-width="13" stroke-linecap="round" opacity="${(1-k).toFixed(2)}"/>`;});}
