<script>
// =============== helpers ===============
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const eob=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const INK='#2a2322';
const VE='vector-effect="non-scaling-stroke"';
const LN=`stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" ${VE}`;
const LN2=`stroke="${INK}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${VE}`;
const TH=(c)=>`stroke="${c}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none" ${VE}`;
function tr(id,x,y,sx=1,sy=sx,r=0){const e=$(id);if(e)e.setAttribute('transform',`translate(${x},${y}) rotate(${r}) scale(${sx},${sy})`);}
function show(id,v){const e=$(id);if(e)e.setAttribute('opacity',v);}
let DEFS='', UID=0;
// shape with airbrushed inner shading (soft darker edge), like the reference
function shaded(d,fill,shade,w=16,extra=''){const id='c'+(UID++);DEFS+=`<clipPath id="${id}"><path d="${d}"/></clipPath>`;
  return `<path d="${d}" fill="${fill}"/><g clip-path="url(#${id})"><path d="${d}" fill="none" stroke="${shade}" stroke-width="${w}" filter="url(#soft)" opacity=".9"/></g><path d="${d}" fill="none" ${LN} ${extra}/>`;}
// Catmull-Rom smooth path through points
function smooth(pts,closed=false){let s=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;const n=pts.length;
  for(let i=0;i<n-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(n-1,i+2)];
    s+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}
  return s;}
// tapered limb around a centre line (shoulder, elbow, wrist)
function limbD(pts,ws){const L=[],R=[];const n=pts.length;
  for(let i=0;i<n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    const w=ws[i]/2;L.push([pts[i][0]-dy*w,pts[i][1]+dx*w]);R.push([pts[i][0]+dy*w,pts[i][1]-dx*w]);}
  const we=ws[n-1]/2, ws0=ws[0]/2;
  let s=smooth(L);s+=` A${we},${we} 0 0 0 ${R[n-1][0].toFixed(1)},${R[n-1][1].toFixed(1)}`;
  const r=smooth(R.slice().reverse());s+=' '+r.replace(/^M[^C]*/,'');s+=` A${ws0},${ws0} 0 0 0 ${L[0][0].toFixed(1)},${L[0][1].toFixed(1)}Z`;return s;}

// ---------- cartoon object eyes (googly, with lids + brows) ----------
function oEye(id,r,lidCol){const c='e'+(UID++);DEFS+=`<clipPath id="${c}"><ellipse rx="${r*.92}" ry="${r}"/></clipPath>`;
  return `<g id="${id}"><ellipse rx="${r*.92}" ry="${r}" fill="#fff"/><g clip-path="url(#${c})"><circle id="${id}_p" r="${r*.46}" fill="#1b1717"/><circle id="${id}_h" r="${r*.15}" fill="#fff"/>
   <g id="${id}_lid"><rect x="${-r*2}" y="${-r*3}" width="${r*4}" height="${r*2}" fill="${lidCol}"/><line x1="${-r*2}" x2="${r*2}" y1="${-r}" y2="${-r}" ${LN2}/></g></g>
   <ellipse rx="${r*.92}" ry="${r}" fill="none" ${LN2}/></g>`;}
// lid: amount 0..1 (closed), tilt degrees ; look dx,dy
function setOEye(id,r,{dx=0,dy=0,lid=.12,tilt=0,blink=0,small=false}={}){const d=Math.hypot(dx,dy)||1,m=r*.42,k=Math.min(1,d/40);
  const px=dx/d*m*k,py=dy/d*m*k;const p=$(id+'_p');p.setAttribute('cx',px);p.setAttribute('cy',py);p.setAttribute('r',r*(small?.3:.46));
  const h=$(id+'_h');h.setAttribute('cx',px-r*.13);h.setAttribute('cy',py-r*.15);
  const L=Math.max(lid,blink);$(id+'_lid').setAttribute('transform',`rotate(${tilt}) translate(0,${L*2*r})`);}
function blinkK(t,ph){const k=(t+ph)%3.9;return k<.13?1-Math.abs(k-.065)/.065:0;}
function brow(id){return `<path id="${id}" fill="none" ${LN2}/>`;}
function setBrow(id,x,y,w,ang,arch=0){$(id).setAttribute('d',`M${x-w/2},${y} Q${x},${y-arch} ${x+w/2},${y}`);$(id).setAttribute('transform',`rotate(${ang},${x},${y})`);}
function mouthD(o,w,mood=0){ // mood: +1 smile, -1 frown
  if(o<.08){return {d:`M${-w*.7},0 Q0,${mood*w*.45} ${w*.7},0`,fill:'none'};}
  const h=3+o*w*1.25;return {d:`M${-w*.75},-1 Q0,${-2+mood*2} ${w*.75},-1 Q${w*.6},${h} 0,${h+1} Q${-w*.6},${h} ${-w*.75},-1Z`,fill:'#5e1a20'};}
function setMouth(id,o,w,mood=0){const m=mouthD(clamp(o),w,mood);const e=$(id);e.setAttribute('d',m.d);e.setAttribute('fill',m.fill);
  const t=$(id+'_t');if(t){t.setAttribute('opacity',o>=.25?1:0);t.setAttribute('cy',2+o*w*1.05);t.setAttribute('rx',w*.4);t.setAttribute('ry',o*w*.35);}}
function mouthEl(id,x,y){return `<g transform="translate(${x},${y})"><path id="${id}" ${LN2}/><path id="${id}_w" fill="#fff" opacity="0"/><ellipse id="${id}_t" cx="0" cy="0" rx="1" ry="1" fill="#d76d72" opacity="0"/></g>`;}

// ---------- data / lip sync ----------
const D=window.DATA, FPS=30;
function speak(who,T){for(const L of D.lines){if(L.who===who&&T>=L.t0&&T<L.t0+L.dur){return L.env[Math.floor((T-L.t0)*FPS)]||0;}}return 0;}
function lineT(id){return D.lines.find(l=>l.id===id).t0;}
function wordT(id,w,n=0){const L=D.lines.find(l=>l.id===id);const m=L.words.filter(x=>x[2]===w);return m[n]?m[n][0]:L.t0;}
function labelBox(id,text,x,y,sz=22){const w=text.length*sz*.66+26;return `<g id="${id}" opacity="0" transform="translate(${x},${y})"><rect x="${-w/2}" y="-20" width="${w}" height="40" fill="#fff" ${LN}/><text class="lbl" style="font-size:${sz}px" text-anchor="middle" y="8">${text}</text></g>`;}
// =============== 019: how picking your nose makes it bleed. The reference's scenes; our drawings, all code ===============
const OLW=`stroke="${INK}" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"`;
const OLW2=`stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"`;

function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const CAV_D='M566,236 C622,236 650,320 654,430 L660,716 C660,790 606,812 520,804 L176,792 C96,786 84,716 150,646 C284,494 440,324 506,262 C524,244 544,236 566,236 Z';

const card=(inner,txt)=>`<g id="inset"><rect x="16" y="130" width="196" height="330" rx="18" fill="#fff" ${OLW}/>${inner}<text x="114" y="440" text-anchor="middle" style="font-family:LG,sans-serif;font-size:20px" fill="#1d2a44">${txt}</text></g>`;
const lim=(d,wd,col=C_SK)=>`<path d="${d}" fill="none" stroke="${INK}" stroke-width="${wd+7}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${wd}" stroke-linecap="round" stroke-linejoin="round"/>`;
const nail=(x,y,rot,s=1)=>`<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})"><path d="M-22,-4 C-22,-34 22,-34 22,-4 L22,26 C22,34 -22,34 -22,26 Z" fill="#fdf3e6" ${OLW2}/></g>`;
// a wobbly stream of blood: top at (x,y0), length L, width wd, ending in lobes
function streamD(x,y0,L,wd,T){const n=7,l=[],rr=[];for(let i=0;i<=n;i++){const y=y0+L*i/n,ww=wd*(1+.16*Math.sin(i*1.9+T*2.2)),o=Math.sin(i*1.2+T*1.6)*wd*.13*(i/n);l.push([x-ww/2+o,y]);rr.push([x+ww/2+o,y]);}
  let d=`M${l[0][0].toFixed(1)},${y0}`;for(let i=1;i<=n;i++)d+=` L${l[i][0].toFixed(1)},${l[i][1].toFixed(1)}`;
  const a=l[n],b=rr[n],u=(b[0]-a[0])/3,k=Math.min(wd*.55,L*.3);d+=` q${(u*.5).toFixed(1)},${k.toFixed(1)} ${u.toFixed(1)},${(k*.1).toFixed(1)} q${(u*.5).toFixed(1)},${(k*1.5).toFixed(1)} ${u.toFixed(1)},${(k*.2).toFixed(1)} q${(u*.5).toFixed(1)},${(k*.8).toFixed(1)} ${u.toFixed(1)},${(-k*.3).toFixed(1)}`;
  for(let i=n-1;i>=0;i--)d+=` L${rr[i][0].toFixed(1)},${rr[i][1].toFixed(1)}`;return d+' Z';}

   <g id="finger"><path d="M-78,1300 L-78,70 C-78,-30 78,-30 78,70 L78,1300 Z" fill="${C_SK}" ${OLW}/><path d="M-50,60 C-50,-6 50,-6 50,60 L50,150 C50,168 -50,168 -50,150 Z" fill="#fdf3e6" ${OLW2}/><path d="M-44,330 q44,14 88,0 M-40,366 q40,12 80,0" fill="none" stroke="${C_SK_S}" stroke-width="5" stroke-linecap="round"/></g>

   <g id="drip1"></g>
