<script>
// =============== helpers ===============
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const eob=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const INK='#2a2322';
const VE='vector-effect="non-scaling-stroke"';
const LN=`stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" ${VE}`;
const LN2=`stroke="${INK}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${VE}`;
const TH=(c)=>`stroke="${c}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none" ${VE}`;
function tr(id,x,y,sx=1,sy=sx,r=0){const e=$(id);if(e)e.setAttribute('transform',`translate(${x},${y}) rotate(${r}) scale(${sx},${sy})`);}
function show(id,v){const e=$(id);if(e)e.setAttribute('opacity',v);}
let DEFS='', UID=0;
// shape with airbrushed inner shading (soft darker edge), like the reference
function shaded(d,fill,shade,w=16,extra=''){const id='c'+(UID++);DEFS+=`<clipPath id="${id}"><path d="${d}"/></clipPath>`;
  return `<path d="${d}" fill="${fill}"/><g clip-path="url(#${id})"><path d="${d}" fill="none" stroke="${shade}" stroke-width="${w}" filter="url(#soft)" opacity=".9"/></g><path d="${d}" fill="none" ${LN} ${extra}/>`;}
// Catmull-Rom smooth path through points
function smooth(pts,closed=false){let s=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;const n=pts.length;
  for(let i=0;i<n-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(n-1,i+2)];
    s+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}
  return s;}
// tapered limb around a centre line (shoulder, elbow, wrist)
function limbD(pts,ws){const L=[],R=[];const n=pts.length;
  for(let i=0;i<n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    const w=ws[i]/2;L.push([pts[i][0]-dy*w,pts[i][1]+dx*w]);R.push([pts[i][0]+dy*w,pts[i][1]-dx*w]);}
  const we=ws[n-1]/2, ws0=ws[0]/2;
  let s=smooth(L);s+=` A${we},${we} 0 0 0 ${R[n-1][0].toFixed(1)},${R[n-1][1].toFixed(1)}`;
  const r=smooth(R.slice().reverse());s+=' '+r.replace(/^M[^C]*/,'');s+=` A${ws0},${ws0} 0 0 0 ${L[0][0].toFixed(1)},${L[0][1].toFixed(1)}Z`;return s;}

// ---------- cartoon object eyes (googly, with lids + brows) ----------
function oEye(id,r,lidCol){const c='e'+(UID++);DEFS+=`<clipPath id="${c}"><ellipse rx="${r*.92}" ry="${r}"/></clipPath>`;
  return `<g id="${id}"><ellipse rx="${r*.92}" ry="${r}" fill="#fff"/><g clip-path="url(#${c})"><circle id="${id}_p" r="${r*.46}" fill="#1b1717"/><circle id="${id}_h" r="${r*.15}" fill="#fff"/>
   <g id="${id}_lid"><rect x="${-r*2}" y="${-r*3}" width="${r*4}" height="${r*2}" fill="${lidCol}"/><line x1="${-r*2}" x2="${r*2}" y1="${-r}" y2="${-r}" ${LN2}/></g></g>
   <ellipse rx="${r*.92}" ry="${r}" fill="none" ${LN2}/></g>`;}
// lid: amount 0..1 (closed), tilt degrees ; look dx,dy
function setOEye(id,r,{dx=0,dy=0,lid=.12,tilt=0,blink=0,small=false}={}){const d=Math.hypot(dx,dy)||1,m=r*.42,k=Math.min(1,d/40);
  const px=dx/d*m*k,py=dy/d*m*k;const p=$(id+'_p');p.setAttribute('cx',px);p.setAttribute('cy',py);p.setAttribute('r',r*(small?.3:.46));
  const h=$(id+'_h');h.setAttribute('cx',px-r*.13);h.setAttribute('cy',py-r*.15);
  const L=Math.max(lid,blink);$(id+'_lid').setAttribute('transform',`rotate(${tilt}) translate(0,${L*2*r})`);}
function blinkK(t,ph){const k=(t+ph)%3.9;return k<.13?1-Math.abs(k-.065)/.065:0;}
function brow(id){return `<path id="${id}" fill="none" ${LN2}/>`;}
function setBrow(id,x,y,w,ang,arch=0){$(id).setAttribute('d',`M${x-w/2},${y} Q${x},${y-arch} ${x+w/2},${y}`);$(id).setAttribute('transform',`rotate(${ang},${x},${y})`);}
function mouthD(o,w,mood=0){ // mood: +1 smile, -1 frown
  if(o<.08){return {d:`M${-w*.7},0 Q0,${mood*w*.45} ${w*.7},0`,fill:'none'};}
  const h=3+o*w*1.25;return {d:`M${-w*.75},-1 Q0,${-2+mood*2} ${w*.75},-1 Q${w*.6},${h} 0,${h+1} Q${-w*.6},${h} ${-w*.75},-1Z`,fill:'#5e1a20'};}
function setMouth(id,o,w,mood=0){const m=mouthD(clamp(o),w,mood);const e=$(id);e.setAttribute('d',m.d);e.setAttribute('fill',m.fill);
  const t=$(id+'_t');if(t){t.setAttribute('opacity',o>=.25?1:0);t.setAttribute('cy',2+o*w*1.05);t.setAttribute('rx',w*.4);t.setAttribute('ry',o*w*.35);}}
function mouthEl(id,x,y){return `<g transform="translate(${x},${y})"><path id="${id}" ${LN2}/><path id="${id}_w" fill="#fff" opacity="0"/><ellipse id="${id}_t" cx="0" cy="0" rx="1" ry="1" fill="#d76d72" opacity="0"/></g>`;}

// ---------- data / lip sync ----------
const D=window.DATA, FPS=30;
function speak(who,T){for(const L of D.lines){if(L.who===who&&T>=L.t0&&T<L.t0+L.dur){return L.env[Math.floor((T-L.t0)*FPS)]||0;}}return 0;}
function lineT(id){return D.lines.find(l=>l.id===id).t0;}
function wordT(id,w,n=0){const L=D.lines.find(l=>l.id===id);const m=L.words.filter(x=>x[2]===w);return m[n]?m[n][0]:L.t0;}
function labelBox(id,text,x,y,sz=22){const w=text.length*sz*.66+26;return `<g id="${id}" opacity="0" transform="translate(${x},${y})"><rect x="${-w/2}" y="-20" width="${w}" height="40" fill="#fff" ${LN}/><text class="lbl" style="font-size:${sz}px" text-anchor="middle" y="8">${text}</text></g>`;}
// =============== SCENE 1 : stomach cross-section (world coords) ===============
function crSample(C,n){const out=[],m=C.length;for(let i=0;i<n;i++){const u=i/(n-1)*(m-1),k=Math.min(m-2,Math.floor(u)),t=u-k;
  const p0=C[Math.max(0,k-1)],p1=C[k],p2=C[k+1],p3=C[Math.min(m-1,k+2)];
  const f=(a,b,c,d)=>0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);out.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])]);}return out;}
function lerpArr(ws,n){const out=[];for(let i=0;i<n;i++){const u=i/(n-1)*(ws.length-1),k=Math.min(ws.length-2,Math.floor(u));out.push(lerp(ws[k],ws[k+1],u-k));}return out;}
function along(pts,u){u=clamp(u);const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const d=u*L[L.length-1];let i=1;while(i<L.length-1&&L[i]<d)i++;const k=(d-L[i-1])/((L[i]-L[i-1])||1);
  return [lerp(pts[i-1][0],pts[i][0],k),lerp(pts[i-1][1],pts[i][1],k),Math.atan2(pts[i][1]-pts[i-1][1],pts[i][0]-pts[i-1][0])*180/Math.PI];}
const STO_C=[[318,372],[470,470],[522,640],[440,830],[262,880]], STO_W=[110,330,340,240,74];
const NS=15, STO_PTS=crSample(STO_C,NS), STO_WS=lerpArr(STO_W,NS);
function stoPaths(sq){const wo=STO_WS.map((w,i)=>w*(1-sq(i))), wi=wo.map(w=>Math.max(12,w-46));return [limbD(STO_PTS,wo),limbD(STO_PTS,wi)];}

function gumBody(id,face,sc=1){return `<g id="${id}"><g id="${id}_i" transform="scale(${sc})"><path d="${GUMD}" fill="url(#gGum)"/><path d="${GUMD}" fill="none" ${LN}/>

  <path d="M-24,12 q4,-4 8,0 M-4,16 q4,-4 8,0 M14,13 q4,-4 8,0" ${TH('#c4467a')}/>
  ${face?`<g id="${id}F"><g transform="translate(-10,-6)">${oEye(id+'E1',9,'#f58fb9')}</g><g transform="translate(11,-6)">${oEye(id+'E2',9,'#f58fb9')}</g>${brow(id+'B1')}${brow(id+'B2')}${mouthEl(id+'_m',0,9)}</g>`:''}
  </g></g>`;}

 <g>${[[110,1080],[300,1150],[520,1110],[640,980],[420,1250],[180,1250]].map(([x,y])=>shaded(`M${x-90},${y} C${x-90},${y-60} ${x+90},${y-60} ${x+90},${y} C${x+90},${y+60} ${x-90},${y+60} ${x-90},${y} Z`,'#e39ea2','#c27479',16)).join('')}</g>
 ${shaded(limbD(DUO_C,[78,78,78,78,78]),'#e47d85','#b9545e',14)}<path d="${limbD(DUO_C,[50,50,50,50,50])}" fill="#f5c2c1"/>
 <clipPath id="stoClip"><path id="stoClipP"/></clipPath><clipPath id="lumClip"><path id="lumClipP"/></clipPath>
 <path id="stoO" fill="#e47d85"/><g clip-path="url(#stoClip)"><path id="stoOs" fill="none" stroke="#b9545e" stroke-width="26" filter="url(#soft)"/></g>
 <path id="stoI" fill="url(#gSto)"/>
 <g clip-path="url(#lumClip)">
   <g fill="none" stroke="#e48e96" stroke-width="5" stroke-linecap="round" opacity=".8">${[0,1,2,3,4,5,6].map(i=>`<path d="M${330+i*40},${420+i*18} q30,40 0,80 q-30,40 0,80 q30,40 0,80"/>`).join('')}</g>
   <circle id="antGlow" cx="300" cy="860" r="90" fill="#e0473f" filter="url(#soft2)" opacity="0"/>
   <g id="acidG"><path id="acidP" fill="#d6d36a" opacity=".88"/><path id="acidHi" fill="none" stroke="#f3f0a8" stroke-width="5" stroke-linecap="round"/>
     ${[0,1,2,3,4,5].map(i=>`<circle id="ab${i}" r="${5+i%3*2}" fill="none" stroke="#f6f3b5" stroke-width="2.5"/>`).join('')}</g>
   ${[0,1,2,3].map(i=>`<g id="fd${i}" opacity="0">${[`<path d="M-18,-10 L18,-12 L20,10 L-16,12 Z" fill="#e2b062" ${LN2}/>`,`<circle r="11" fill="#86b64e" ${LN2}/>`,`<path d="M-20,0 C-10,-12 10,12 20,0" fill="none" stroke="#f1d27c" stroke-width="7" stroke-linecap="round"/>`,`<path d="M-14,-12 L16,-8 L12,12 L-16,8 Z" fill="#c9673f" ${LN2}/>`][i]}</g>`).join('')}
 </g>
 <path id="stoOl" fill="none" ${LN}/><path id="stoIl" fill="none" stroke="#c45f69" stroke-width="2.2" ${VE}/>
 ${shaded(limbD(ESO_C,[92,90,92,104]),'#e47d85','#b9545e',12)}<path d="${limbD(ESO_C,[60,58,60,66])}" fill="#f5c2c1"/>
 <g id="stoFace"><g transform="translate(428,318)">${oEye('sfE1',25,'#e47d85')}</g><g transform="translate(500,324)">${oEye('sfE2',25,'#e47d85')}</g>${brow('sfB1')}${brow('sfB2')}${mouthEl('sf_m',466,372)}
   <g id="sfSweat" opacity="0"><path d="M560,300 C566,312 568,320 560,326 C552,320 554,312 560,300Z" fill="#8fd3f4" ${LN2}/></g></g>
 ${[0,1,2,3,4].map(i=>`<g id="adrop${i}" opacity="0"><path d="M0,-8 C5,-2 6,4 0,8 C-6,4 -5,-2 0,-8Z" fill="#d6d36a" ${LN2}/></g>`).join('')}
 ${[0,1,2].map(i=>`<g id="stm${i}" opacity="0"><path d="M0,0 c-10,-10 10,-20 0,-30 c-10,-10 10,-20 0,-30" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".85"/></g>`).join('')}
 ${[0,1,2,3,4].map(i=>gumBody('gp'+i,false,.62)).join('')}
 ${gumBody('blob',true,1)}
 ${gumBody('gum',true,1)}
 <g id="shades" opacity="0"><path d="M-22,-12 h17 v9 q-8,7 -17,0 Z M4,-12 h17 v9 q-8,7 -17,0 Z" fill="#1d1b20" ${LN2}/><path d="M-5,-10 h9" stroke="${INK}" stroke-width="2.5"/></g>
 <g id="gSpark" opacity="0">${[[34,-26],[-36,-22],[40,14]].map(([x,y],i)=>`<path id="gs${i}" transform="translate(${x},${y})" d="M0,-9 L2.5,-2.5 9,0 2.5,2.5 0,9 -2.5,2.5 -9,0 -2.5,-2.5Z" fill="#fff6b0" ${LN2}/>`).join('')}</g>
</g>`;
let S1=`<g id="s1"><g id="cam">${W}</g>${labelBox('lbSto','STOMACH',560,110)}${labelBox('lbAcid','STOMACH ACID',360,1000,20)}</g>`;

// =============== SCENE 3 : intestines ===============
const IC=crSample([[-90,130],[560,150],[630,300],[120,380],[80,540],[600,600],[640,760],[110,830],[90,990],[560,1050],[640,1200],[650,1420]],70);
let S3=`<g id="s3"><g id="icam"><rect x="-700" y="-700" width="2120" height="2680" fill="${TIS}"/>
 ${shaded(limbD(IC,IC.map(()=>134)),'#e7979c','#bf6a71',18)}<path d="${limbD(IC,IC.map(()=>94))}" fill="#f7cdcc"/>
 <path d="${limbD(IC,IC.map(()=>94))}" fill="none" stroke="#c45f69" stroke-width="2" ${VE}/>
 <g transform="translate(332,498)">${oEye('inE1',21,'#e7979c')}</g><g transform="translate(392,504)">${oEye('inE2',21,'#e7979c')}</g>${brow('inB1')}${brow('inB2')}${mouthEl('in_m',362,532)}
 ${gumBody('igum',true,1)}
 <g id="swirl" opacity="0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">${[0,1,2].map(i=>`<path d="M${-40-i*20},0 A${40+i*20},${40+i*20} 0 0 1 0,${-40-i*20}"/>`).join('')}</g>
 </g>${labelBox('lbInt','INTESTINES',190,110)}</g>`;
// =============== LATER card ===============
let SL=`<g id="sL"><rect width="720" height="1280" fill="#0b0b0d"/><text id="laterT" x="360" y="660" text-anchor="middle" class="cta" style="font-size:64px;stroke-width:8px" fill="#ffd21f">2 DAYS LATER...</text></g>`;

// =============== SCENE 2 : ENT clinic ===============
function hand(x,y,ang,sc,skin,id=''){return `<g ${id?`id="${id}"`:''} transform="translate(${x},${y}) rotate(${ang}) scale(${sc})">
  <path d="M-11,-12 C-4,-17 9,-16 13,-8 C17,2 15,14 6,18 C-4,22 -14,16 -16,6 C-17,-2 -15,-8 -11,-12 Z" fill="${skin}" ${LN2}/>
  <path d="M-12,-6 C-20,-12 -24,-6 -18,2" fill="${skin}" ${LN2}/><path d="M-2,4 q4,6 10,6 M0,-4 q5,5 12,5" ${TH('#9c6b52')}/></g>`;}
function humanEye(id,x,y,w,h){const c='h'+(UID++);DEFS+=`<clipPath id="${c}"><path d="M${-w},0 Q0,${-h*1.5} ${w},0 Q0,${h*1.1} ${-w},0Z"/></clipPath>`;
  return `<g transform="translate(${x},${y})"><g id="${id}"><path d="M${-w},0 Q0,${-h*1.5} ${w},0 Q0,${h*1.1} ${-w},0Z" fill="#fff"/>
   <g clip-path="url(#${c})"><circle id="${id}_p" r="${h*.78}" fill="#3a2a20"/><circle id="${id}_q" r="${h*.38}" fill="#111"/><circle id="${id}_h" r="${h*.2}" fill="#fff"/></g>
   <path d="M${-w-1},0 Q0,${-h*1.55} ${w+1},0" fill="none" stroke="${INK}" stroke-width="2.8" stroke-linecap="round" ${VE}/><path d="M${-w*.8},${h*.35} Q0,${h*1.05} ${w*.8},${h*.35}" fill="none" ${TH('#8d6a5a')}/></g></g>`;}
function setHEye(id,dx,blink){const p=$(id+'_p'),q=$(id+'_q'),h=$(id+'_h');[p,q].forEach(e=>{e.setAttribute('cx',dx);e.setAttribute('cy',1);});h.setAttribute('cx',dx-2);h.setAttribute('cy',-1.5);
  $(id).setAttribute('transform',`scale(1,${1-blink*.92})`);}

const DSK='#f0c6a6', DSK_S='#d9a585', DHAIR='#3b2820';
function doctorSVG(){return `<g id="doc">
 <ellipse cx="0" cy="782" rx="92" ry="12" fill="#000" opacity=".12"/>
 <!-- back hair -->
 <path d="M-64,70 C-74,130 -70,190 -48,214 L50,214 C70,190 74,130 64,70 Z" fill="${DHAIR}" ${LN}/>
 <!-- legs -->
 ${shaded(limbD([[-30,500],[-34,640],[-34,760]],[52,44,38]),'#33465f','#22324a',10)}
 ${shaded(limbD([[30,500],[34,640],[36,760]],[52,44,38]),'#33465f','#22324a',10)}
 <path d="M-58,756 C-58,744 -12,742 -10,756 L-10,772 L-62,774 Z" fill="#3c3f46" ${LN2}/><path d="M12,756 C14,742 60,744 60,756 L62,774 L10,772 Z" fill="#3c3f46" ${LN2}/>
 <!-- scrubs + coat -->
 ${shaded('M-62,214 C-40,204 40,204 62,214 L70,520 L-70,520 Z','#3f9c96','#2c7d78',14)}
 ${shaded('M-20,206 L-62,212 C-92,222 -100,250 -102,290 L-110,560 L-46,566 L-16,330 L-8,250 Z','#f8f8f6','#d4d9dd',18)}
 ${shaded('M20,206 L62,212 C92,222 100,250 102,290 L110,560 L46,566 L16,330 L8,250 Z','#f8f8f6','#d4d9dd',18)}
 <path d="M-20,206 L-2,262 L-8,330 M20,206 L2,262 L8,330" fill="none" ${TH('#9aa3aa')}/>
 <path d="M-90,430 h34 v40 h-34 Z M56,430 h34 v40 h-34 Z" fill="none" ${TH('#9aa3aa')}/>
 <rect x="54" y="300" width="30" height="40" rx="4" fill="#d9ecf5" ${LN2}/><rect x="60" y="306" width="18" height="12" fill="#8db4c8"/>
 <!-- stethoscope -->
 <path d="M-26,212 C-38,270 -24,322 0,326 C24,322 38,270 26,212" fill="none" stroke="#454b55" stroke-width="5.5" stroke-linecap="round"/>
 <circle cx="0" cy="334" r="11" fill="#c9cfd6" ${LN2}/>
 <!-- neck + head -->
 <path d="M-17,150 L-16,206 L16,206 L17,150 Z" fill="${DSK}" ${LN2}/><path d="M-16,176 C-6,186 6,186 16,176 L16,206 L-16,206Z" fill="${DSK_S}" opacity=".7"/>
 <g id="docHead">
